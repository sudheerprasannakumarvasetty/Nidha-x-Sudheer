<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Creative Feedback — Sudheer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
/* ── TOKENS ─────────────────────────────────────────────────────── */
:root {
  --bg:     #080808;
  --s1:     #101010;
  --s2:     #181818;
  --gold:   #C8A84C;
  --gbg:    rgba(200,168,76,.08);
  --gbd:    rgba(200,168,76,.4);
  --t1:     #ECE8DF;
  --t2:     #68635C;
  --t3:     #28251F;
  --bd:     rgba(255,255,255,.055);
  --serif:  'DM Serif Display', Georgia, serif;
  --sans:   'DM Sans', system-ui, sans-serif;
  --ease:   cubic-bezier(.25,.46,.45,.94);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { height: 100%; }
body {
  min-height: 100%;
  background: var(--bg);
  color: var(--t1);
  font-family: var(--sans);
  font-weight: 400;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}

/* ── LAYOUT ──────────────────────────────────────────────────────── */
#app { min-height: 100dvh; display: flex; flex-direction: column; }

/* Progress */
#prog-track {
  position: fixed; top: 0; left: 0;
  width: 100%; height: 1px;
  background: var(--t3); z-index: 100;
  opacity: 0; transition: opacity .3s;
}
#prog-track.vis { opacity: 1; }
#prog-fill { height: 100%; background: var(--gold); transition: width .55s var(--ease); }
#prog-label {
  position: fixed; top: 22px; right: 26px;
  font-size: 10px; font-weight: 500;
  letter-spacing: .14em; color: var(--t2);
  z-index: 100; opacity: 0; transition: opacity .3s;
  font-feature-settings: 'tnum';
}
#prog-label.vis { opacity: 1; }

/* Screen */
#screen {
  flex: 1; display: flex; flex-direction: column;
  justify-content: center;
  padding: 88px 28px 48px;
  max-width: 620px; margin: 0 auto; width: 100%;
  min-height: 100dvh;
  transition: opacity .26s var(--ease), transform .26s var(--ease);
}
#screen.out { opacity: 0; transform: translateY(-16px); pointer-events: none; }
#screen.in  { opacity: 0; transform: translateY(20px); }

/* ── TYPE ────────────────────────────────────────────────────────── */
.eyebrow {
  font-size: 10px; font-weight: 500;
  letter-spacing: .22em; color: var(--t2);
  text-transform: uppercase; margin-bottom: 30px; display: block;
}
.eyebrow em { color: var(--gold); font-style: normal; }
.display {
  font-family: var(--serif);
  font-size: clamp(28px, 6vw, 50px);
  line-height: 1.15; color: var(--t1);
  margin-bottom: 18px; font-weight: 400;
}
.q-ghost {
  font-family: var(--serif);
  font-size: clamp(72px, 18vw, 120px);
  color: var(--t3); line-height: .9;
  margin-bottom: -10px; display: block; user-select: none;
}
.q-text {
  font-family: var(--serif);
  font-size: clamp(19px, 4vw, 28px);
  line-height: 1.4; color: var(--t1);
  margin-bottom: 34px; font-weight: 400;
}
.body-md { font-size: 14px; color: var(--t2); line-height: 1.75; }
.note-sm { font-size: 12px; color: var(--t2); font-style: italic; line-height: 1.5; }

/* ── INTRO ───────────────────────────────────────────────────────── */
.rule { width: 28px; height: 1px; background: var(--t3); margin: 26px 0; }
.intro-dot {
  width: 5px; height: 5px; border-radius: 50%;
  background: var(--gold); display: inline-block; margin-right: 10px; vertical-align: middle;
}
.intro-time { font-size: 12px; color: var(--t2); margin-bottom: 52px; }

/* ── BUTTONS ─────────────────────────────────────────────────────── */
.btn-start {
  display: inline-flex; align-items: center; gap: 10px;
  font-family: var(--sans); font-size: 14px; font-weight: 500;
  color: var(--bg); background: var(--t1);
  border: none; border-radius: 2px;
  padding: 14px 30px; cursor: pointer;
  transition: opacity .18s, transform .12s;
  letter-spacing: .02em;
}
.btn-start:hover { opacity: .85; transform: translateY(-1px); }
.btn-start:active { transform: none; }

.btn-row {
  display: flex; align-items: center;
  justify-content: space-between;
  margin-top: 40px; flex-wrap: wrap; gap: 12px;
}
.btn-back {
  font-size: 12px; color: var(--t2); background: none;
  border: none; cursor: pointer; padding: 0;
  display: flex; align-items: center; gap: 6px;
  transition: color .18s; font-family: var(--sans);
}
.btn-back:hover { color: var(--t1); }

.btn-next {
  display: inline-flex; align-items: center; gap: 8px;
  font-family: var(--sans); font-size: 13px; font-weight: 500;
  color: var(--t2); background: none;
  border: 1px solid var(--t3); border-radius: 2px;
  padding: 11px 20px; cursor: pointer;
  transition: all .18s; letter-spacing: .02em;
}
.btn-next:hover:not(:disabled) { color: var(--t1); border-color: rgba(255,255,255,.16); }
.btn-next.on {
  color: var(--bg); background: var(--t1); border-color: var(--t1);
}
.btn-next.on:hover { opacity: .87; }
.btn-next:disabled { opacity: .28; cursor: default; }

.key-hint {
  font-size: 11px; color: var(--t3);
  display: flex; align-items: center; gap: 4px;
}
.key-hint kbd {
  font-family: var(--sans); background: var(--s2);
  border: 1px solid var(--t3); border-radius: 2px;
  padding: 1px 5px; font-size: 10px; color: var(--t2);
}
.btn-right { display: flex; align-items: center; gap: 14px; }

/* ── CARDS (Q1) ──────────────────────────────────────────────────── */
.card-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(155px, 1fr));
  gap: 7px; margin-bottom: 6px;
}
.c-opt {
  padding: 13px 14px;
  background: var(--s1); border: 1px solid var(--bd);
  border-radius: 2px; cursor: pointer;
  font-size: 13px; color: var(--t2);
  transition: all .15s; user-select: none;
  display: flex; align-items: center; gap: 10px;
  line-height: 1.3;
}
.c-opt:hover { border-color: rgba(255,255,255,.12); color: var(--t1); }
.c-opt.on { border-color: var(--gbd); background: var(--gbg); color: var(--t1); }
.c-chk {
  width: 13px; height: 13px;
  border: 1.5px solid var(--t3); border-radius: 2px;
  flex-shrink: 0; display: grid; place-items: center;
  transition: all .15s;
}
.c-opt.on .c-chk { background: var(--gold); border-color: var(--gold); }
.c-opt.on .c-chk::after {
  content: ''; width: 4px; height: 7px;
  border: 1.5px solid #000; border-top: none; border-left: none;
  transform: rotate(43deg) translateY(-1px);
}

/* ── SCALE (Q3, Q4) ──────────────────────────────────────────────── */
.scale-row {
  display: flex; gap: 8px; margin-bottom: 10px;
}
.s-opt {
  flex: 1; aspect-ratio: 1; max-width: 76px;
  border: 1px solid var(--bd); border-radius: 2px;
  background: var(--s1);
  font-family: var(--serif); font-size: clamp(22px, 4.5vw, 32px);
  color: var(--t2); cursor: pointer;
  display: grid; place-items: center;
  transition: all .17s; user-select: none;
}
.s-opt:hover { border-color: var(--gbd); color: var(--t1); }
.s-opt.on { background: var(--gold); border-color: var(--gold); color: var(--bg); }
.scale-lbs {
  display: flex; justify-content: space-between;
  padding: 0 1px;
}
.scale-lbs span { font-size: 11px; color: var(--t2); max-width: 42%; line-height: 1.4; }
.scale-lbs span:last-child { text-align: right; }

/* ── TEXTAREA ─────────────────────────────────────────────────────── */
.ta-wrap { margin-bottom: 4px; }
textarea {
  width: 100%; background: transparent;
  border: none; border-bottom: 1px solid var(--t3);
  color: var(--t1); font-family: var(--sans);
  font-size: 16px; font-weight: 300; line-height: 1.75;
  padding: 6px 0 12px; resize: none; outline: none;
  min-height: 130px; transition: border-color .2s;
}
textarea::placeholder { color: var(--t2); font-size: 15px; }
textarea:focus { border-bottom-color: var(--gold); }
.char { font-size: 11px; color: var(--t3); text-align: right; margin-top: 5px; }

/* ── FIELD INPUTS (meta) ──────────────────────────────────────────── */
.field-stack { display: flex; flex-direction: column; gap: 26px; margin-bottom: 6px; }
.field-wrap label {
  font-size: 10px; letter-spacing: .12em; color: var(--t2);
  text-transform: uppercase; display: block; margin-bottom: 8px;
}
.field-wrap input {
  width: 100%; background: transparent;
  border: none; border-bottom: 1px solid var(--t3);
  color: var(--t1); font-family: var(--sans);
  font-size: 19px; font-weight: 300;
  padding: 4px 0 10px; outline: none;
  transition: border-color .2s;
}
.field-wrap input:focus { border-bottom-color: var(--gold); }
.field-wrap input::placeholder { color: var(--t2); font-size: 17px; }

/* ── PERMISSION (Q9) ──────────────────────────────────────────────── */
.perm-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 6px; }
.p-opt {
  padding: 16px 18px;
  background: var(--s1); border: 1px solid var(--bd);
  border-radius: 2px; cursor: pointer; transition: all .16s; user-select: none;
}
.p-opt:hover { border-color: rgba(255,255,255,.12); }
.p-opt.on { border-color: var(--gbd); background: var(--gbg); }
.p-title { font-size: 14px; color: var(--t1); margin-bottom: 3px; font-weight: 500; }
.p-opt.on .p-title { color: var(--gold); }
.p-sub { font-size: 12px; color: var(--t2); line-height: 1.4; }

/* ── PRIVACY ──────────────────────────────────────────────────────── */
.priv-box {
  background: var(--s1); border: 1px solid var(--bd);
  border-radius: 2px; padding: 20px 22px; margin-bottom: 26px;
}
.priv-box p { font-size: 13px; color: var(--t2); line-height: 1.7; }
.priv-box p + p { margin-top: 8px; }

/* ── STATUS ───────────────────────────────────────────────────────── */
.err-msg {
  display: none; font-size: 13px;
  padding: 12px 16px; border-radius: 2px; margin-bottom: 14px;
  background: rgba(255,70,70,.07);
  border: 1px solid rgba(255,70,70,.18);
  color: #ff7575;
}
.err-msg.show { display: block; }
.spinner {
  width: 14px; height: 14px;
  border: 2px solid var(--t3); border-top-color: var(--t1);
  border-radius: 50%; animation: spin .65s linear infinite; display: inline-block;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ── SUCCESS ──────────────────────────────────────────────────────── */
.success-glyph {
  font-family: var(--serif); font-style: italic;
  font-size: 52px; color: var(--gold);
  margin-bottom: 22px; display: block; line-height: 1;
}

/* ── ADMIN ────────────────────────────────────────────────────────── */
#admin-panel {
  display: none; min-height: 100dvh;
  padding: 44px 26px 60px;
  max-width: 860px; margin: 0 auto;
}
.adm-head {
  display: flex; align-items: baseline;
  justify-content: space-between;
  border-bottom: 1px solid var(--bd);
  padding-bottom: 18px; margin-bottom: 28px;
}
.adm-head h2 { font-family: var(--serif); font-size: 22px; }
.adm-meta { font-size: 12px; color: var(--t2); }
.sub-card {
  background: var(--s1); border: 1px solid var(--bd);
  border-radius: 2px; padding: 20px 22px; margin-bottom: 10px;
}
.sub-top {
  display: flex; justify-content: space-between;
  align-items: flex-start; margin-bottom: 14px;
  gap: 12px; flex-wrap: wrap;
}
.sub-name { font-size: 15px; font-weight: 500; }
.sub-role { font-size: 12px; color: var(--t2); margin-top: 2px; }
.sub-right { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
.sub-date { font-size: 11px; color: var(--t2); }
.badge {
  font-size: 9px; font-weight: 500; letter-spacing: .1em;
  text-transform: uppercase; padding: 3px 9px;
  border-radius: 2px; cursor: pointer; border: 1px solid;
  transition: all .15s; user-select: none;
}
.badge.private   { border-color: var(--t3); color: var(--t2); }
.badge.approved  { border-color: var(--gbd); color: var(--gold); }
.badge.published { background: var(--gold); border-color: var(--gold); color: var(--bg); }
.sub-row { font-size: 13px; color: var(--t2); margin-bottom: 8px; line-height: 1.5; }
.sub-row strong { color: var(--t1); font-weight: 500; }
.r-pill {
  display: inline-grid; place-items: center;
  width: 26px; height: 26px;
  background: var(--gbg); border: 1px solid var(--gbd);
  border-radius: 2px;
  font-family: var(--serif); font-size: 15px; color: var(--gold);
  margin-right: 6px; vertical-align: middle;
}
.expand-btn {
  font-size: 12px; color: var(--t2); cursor: pointer;
  background: none; border: none; padding: 0; margin-top: 6px;
  text-decoration: underline; text-decoration-color: var(--t3);
  font-family: var(--sans);
}
.expand-btn:hover { color: var(--t1); }
.sub-detail { display: none; margin-top: 14px; border-top: 1px solid var(--bd); padding-top: 14px; }
.sub-detail.open { display: block; }
.det-field { margin-bottom: 14px; }
.det-field label {
  font-size: 9px; letter-spacing: .12em; text-transform: uppercase;
  color: var(--t2); display: block; margin-bottom: 4px;
}
.det-field p { font-size: 13px; color: var(--t1); line-height: 1.65; }
.tag-row { display: flex; flex-wrap: wrap; gap: 5px; }
.tag {
  font-size: 11px; color: var(--t2); background: var(--s2);
  border: 1px solid var(--bd); border-radius: 2px; padding: 3px 8px;
}

/* ── RESPONSIVE ───────────────────────────────────────────────────── */
@media (max-width: 480px) {
  #screen { padding: 64px 20px 36px; }
  .card-grid { grid-template-columns: 1fr 1fr; }
  .s-opt { font-size: 20px; }
}
@media (prefers-reduced-motion: reduce) {
  #screen { transition: none; }
  #prog-fill { transition: none; }
}
</style>
</head>
<body>

<div id="app">
  <div id="prog-track"><div id="prog-fill"></div></div>
  <div id="prog-label"></div>
  <div id="screen"></div>
</div>
<div id="admin-panel"></div>

<script>
/* ════════════════════════════════════════════════════════
   ⚙  CONFIG  — Replace before deploying
   The anon key is public and safe to use client-side.
   Enable Row Level Security (RLS) on Supabase.
   See SQL setup at the bottom of this file.
════════════════════════════════════════════════════════ */
const CFG = {
  url:           'https://lyucakpjcfupsppyrxxs.supabase.co',
  key:           'sb_publishable_1SumiqGe7_lrWsQE0BQJ1A_apTKVv34',
  table:         'feedback_responses',
  adminPassword: 'nidha2025',             // ← change this
};

/* ── SUPABASE INIT ──────────────────────────────────────────── */
let db = null;
try {
  if (!CFG.url.includes('YOUR_')) {
    db = supabase.createClient(CFG.url, CFG.key);
  }
} catch (e) { console.warn('Supabase:', e); }

/* ── STATE ──────────────────────────────────────────────────── */
const S = {
  screen: 'intro',
  name: '', role: '',
  workAreas: [],
  q2:'', q3:null, q4:null,
  q5:'', q6:'', q7:'', q8:'',
  q9:'', q10:'',
  submitting: false,
  submitted: false,
};

/* ── SCREEN ORDER ───────────────────────────────────────────── */
const FLOW = [
  'intro','meta',
  'q1','q2','q3','q4','q5','q6','q7','q8','q9','q10',
  'privacy','success'
];
const TOTAL = 10;

function qNum() {
  const i = FLOW.indexOf(S.screen);
  if (i < 2 || i > 11) return null;
  return i - 1; // q1 → 1, q10 → 10
}

/* ── TRANSITIONS ────────────────────────────────────────────── */
function goTo(s) {
  const el = document.getElementById('screen');
  el.classList.add('out');
  setTimeout(() => {
    S.screen = s;
    el.classList.remove('out');
    el.classList.add('in');
    render();
    requestAnimationFrame(() => requestAnimationFrame(() => el.classList.remove('in')));
  }, 265);
}
function next() {
  const i = FLOW.indexOf(S.screen);
  if (i < FLOW.length - 1) goTo(FLOW[i + 1]);
}
function back() {
  const i = FLOW.indexOf(S.screen);
  if (i > 0) goTo(FLOW[i - 1]);
}

/* ── PROGRESS BAR ───────────────────────────────────────────── */
function updateProgress() {
  const t = document.getElementById('prog-track');
  const f = document.getElementById('prog-fill');
  const l = document.getElementById('prog-label');
  const n = qNum();
  if (n) {
    t.classList.add('vis'); l.classList.add('vis');
    f.style.width = ((n / TOTAL) * 100) + '%';
    l.textContent = pad(n) + ' / ' + pad(TOTAL);
  } else if (S.screen === 'privacy') {
    t.classList.add('vis'); f.style.width = '100%';
    l.classList.remove('vis');
  } else {
    t.classList.remove('vis'); l.classList.remove('vis');
  }
}
function pad(n) { return String(n).padStart(2, '0'); }
function esc(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;')
    .replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

/* ── RENDER ROUTER ──────────────────────────────────────────── */
function render() {
  updateProgress();
  const el = document.getElementById('screen');
  const screens = {
    intro:   renderIntro,
    meta:    renderMeta,
    q1:      renderQ1,
    q2:      () => renderTA('q2',true,
      'When you think about my work at Nidha — what do you feel was my strongest creative advantage?',
      'What made the work feel distinctly mine — an approach, a quality, a habit of thinking…'),
    q3:      () => renderScale('q3',
      'How effectively did I translate a requirement or idea into a finished creative piece?',
      'Required significant guidance','Consistently added creative value beyond the brief'),
    q4:      () => renderScale('q4',
      'When a video required corrections, re-editing or a different creative approach — how effectively did I adapt?',
      'Struggled to adjust','Adapted quickly and improved the work'),
    q5:      () => renderTA('q5',false,
      'Was there a particular video, property showcase, AI visual, edit, shoot or creative concept that stood out to you?',
      'Name the project and what made it memorable…'),
    q6:      () => renderTA('q6',false,
      'Comparing my work when I first started at Nidha to my later work — what creative development did you notice most?',
      'Even a small shift in quality, confidence, or approach…'),
    q7:      () => renderTA('q7',false,
      'If I want to become a stronger Video and AI Creative Professional — what 2–3 skills would you recommend I develop next?',
      'Honest suggestions are the most useful ones…'),
    q8:      () => renderTA('q8',false,
      'If someone in the creative industry asked: "What kind of creative professional is he, and what can he be trusted to handle?" — what would you say?',
      'As if you were personally vouching for me…'),
    q9:      renderQ9,
    q10:     () => renderTA('q10',false,
      'Before you finish — is there anything you would personally like to tell me about my work, my growth, or my journey ahead?',
      'This one is just for me.'),
    privacy: renderPrivacy,
    success: renderSuccess,
  };
  el.innerHTML = (screens[S.screen] || (() => ''))();
  afterRender();
}

/* ── INDIVIDUAL SCREENS ─────────────────────────────────────── */
function renderIntro() {
  return `
  <span class="eyebrow"><em>Nidha</em> × Creative Work</span>
  <h1 class="display">A short reflection<br>on the creative work<br><em>I handled.</em></h1>
  <div class="rule"></div>
  <p class="body-md" style="margin-bottom:22px;">You worked alongside my work throughout. This form captures your honest perspective — not a performance review, but a creative record.</p>
  <p class="intro-time"><span class="intro-dot"></span>Approximately 4–6 minutes</p>
  <button class="btn-start" onclick="next()">Begin &nbsp;→</button>`;
}

function renderMeta() {
  const ok = S.name.trim() && S.role.trim();
  return `
  <span class="eyebrow">Before we begin</span>
  <h2 class="q-text" style="margin-top:4px;">Who is filling this in?</h2>
  <p class="body-md" style="margin-bottom:30px;">This helps me correctly attribute the feedback in my records.</p>
  <div class="field-stack">
    <div class="field-wrap">
      <label for="inp-name">Your name</label>
      <input id="inp-name" type="text" placeholder="e.g. Divya" value="${esc(S.name)}" autocomplete="name">
    </div>
    <div class="field-wrap">
      <label for="inp-role">Your role at Nidha</label>
      <input id="inp-role" type="text" placeholder="e.g. Creative Director" value="${esc(S.role)}" autocomplete="organization-title">
    </div>
  </div>
  <div class="btn-row">
    <button class="btn-back" onclick="back()">← Back</button>
    <button id="btn-meta" class="btn-next ${ok?'on':''}" onclick="saveMeta()" ${ok?'':'disabled'}>
      Continue →
    </button>
  </div>`;
}

function renderQ1() {
  const opts = [
    'Video Editing','Property Showcase','AI Video','AI Visuals / AI B-roll',
    'Creative Editing','Script / Content','Storyboarding','Property Shoots',
    'Re-edits / Corrections','Creative Ideation'
  ];
  const cards = opts.map(o => `
    <div class="c-opt${S.workAreas.includes(o)?' on':''}" onclick="toggleArea(this,'${esc(o)}')" role="checkbox" aria-checked="${S.workAreas.includes(o)}">
      <span class="c-chk"></span>${esc(o)}
    </div>`).join('');
  const ok = S.workAreas.length > 0;
  return `
  <span class="q-ghost">01</span>
  <h2 class="q-text">What areas of work did you see me handle?</h2>
  <p class="note-sm" style="margin-bottom:18px;">Select all that apply.</p>
  <div class="card-grid">${cards}</div>
  <div class="btn-row">
    <button class="btn-back" onclick="back()">← Back</button>
    <div class="btn-right">
      <span class="key-hint"><kbd>Enter</kbd></span>
      <button id="btn-q1" class="btn-next${ok?' on':''}" onclick="next()" ${ok?'':'disabled'}>Continue →</button>
    </div>
  </div>`;
}

function renderTA(key, required, question, placeholder) {
  const n    = qNum();
  const val  = S[key] || '';
  const ok   = required ? val.trim().length > 10 : true;
  const skip = !val.trim() && !required;
  return `
  <span class="q-ghost">${pad(n)}</span>
  <h2 class="q-text">${question}</h2>
  <div class="ta-wrap">
    <textarea id="ta-${key}" rows="5" placeholder="${placeholder}" maxlength="1200"
      oninput="taInput('${key}',this,${required})">${esc(val)}</textarea>
    <div class="char" id="char-${key}">${val.length} / 1200</div>
  </div>
  <div class="btn-row">
    <button class="btn-back" onclick="back()">← Back</button>
    <div class="btn-right">
      <span class="key-hint"><kbd>⌘</kbd><kbd>↵</kbd></span>
      <button id="btn-ta" class="btn-next${ok?' on':''}" onclick="next()" ${ok?'':'disabled'}>
        ${skip ? 'Skip →' : 'Continue →'}
      </button>
    </div>
  </div>`;
}

function renderScale(key, question, labelL, labelR) {
  const n   = qNum();
  const val = S[key];
  const nums = [1,2,3,4,5].map(v => `
    <div class="s-opt${val===v?' on':''}" onclick="setScale('${key}',${v})"
      data-v="${v}" role="radio" aria-checked="${val===v}" tabindex="0">${v}</div>`).join('');
  return `
  <span class="q-ghost">${pad(n)}</span>
  <h2 class="q-text">${question}</h2>
  <div style="margin-bottom:6px;">
    <div class="scale-row">${nums}</div>
    <div class="scale-lbs"><span>${labelL}</span><span>${labelR}</span></div>
  </div>
  <div class="btn-row">
    <button class="btn-back" onclick="back()">← Back</button>
    <button id="btn-sc" class="btn-next${val?' on':''}" onclick="next()" ${val?'':'disabled'}>Continue →</button>
  </div>`;
}

function renderQ9() {
  const n   = qNum();
  const opts = [
    { v:'named',   t:'Yes — with my name and designation', s:'Your name and role will appear alongside selected quotes in my portfolio.' },
    { v:'anon',    t:'Yes — without my name',              s:'Selected quotes may appear in my portfolio without attribution.' },
    { v:'private', t:'No — keep it private',               s:'Nothing from your feedback will be published anywhere.' },
  ];
  const cards = opts.map(o => `
    <div class="p-opt${S.q9===o.v?' on':''}" onclick="S.q9='${o.v}';render()" role="radio" aria-checked="${S.q9===o.v}">
      <div class="p-title">${o.t}</div>
      <div class="p-sub">${o.s}</div>
    </div>`).join('');
  return `
  <span class="q-ghost">${pad(n)}</span>
  <h2 class="q-text">May I use selected parts of your feedback as a professional testimonial?</h2>
  <div class="perm-list">${cards}</div>
  <div class="btn-row">
    <button class="btn-back" onclick="back()">← Back</button>
    <button class="btn-next${S.q9?' on':''}" onclick="next()" ${S.q9?'':'disabled'}>Continue →</button>
  </div>`;
}

function renderPrivacy() {
  return `
  <span class="eyebrow">Almost done</span>
  <h2 class="q-text">Your privacy comes first.</h2>
  <div class="priv-box">
    <p>Your responses are collected solely for my professional development and portfolio documentation.</p>
    <p>Nothing will be published publicly without your explicit permission — as you indicated earlier.</p>
    <p>This form is not connected to Nidha's systems. Your responses go directly to me.</p>
  </div>
  <div id="err-msg" class="err-msg"></div>
  <div class="btn-row">
    <button class="btn-back" onclick="back()">← Back</button>
    <button id="btn-sub" class="btn-next on" onclick="submitForm()">Submit feedback →</button>
  </div>`;
}

function renderSuccess() {
  return `
  <span class="success-glyph">✦</span>
  <h1 class="display">Thank you.</h1>
  <div class="rule"></div>
  <p class="body-md">Your feedback will help me understand what I should carry forward, what I should improve, and how I can continue growing in the creative field.</p>
  <p class="body-md" style="margin-top:18px;color:var(--t2);">I genuinely appreciate the time you gave to this.</p>`;
}

/* ── EVENT BINDINGS ─────────────────────────────────────────── */
function afterRender() {
  // Focus
  const ta  = document.querySelector('textarea');
  const inp = document.querySelector('input[type="text"]');
  if (ta)  setTimeout(() => ta.focus(), 300);
  if (inp) setTimeout(() => inp.focus(), 300);

  // Meta live binding
  const nm = document.getElementById('inp-name');
  const rl = document.getElementById('inp-role');
  if (nm) nm.addEventListener('input', () => {
    S.name = nm.value;
    const ro = document.getElementById('inp-role');
    syncMetaBtn(S.name, ro ? ro.value : S.role);
  });
  if (rl) {
    rl.addEventListener('input', () => {
      S.role = rl.value;
      const na = document.getElementById('inp-name');
      syncMetaBtn(na ? na.value : S.name, S.role);
    });
    rl.addEventListener('keydown', e => { if (e.key==='Enter') saveMeta(); });
  }
  if (nm) nm.addEventListener('keydown', e => { if (e.key==='Tab') return; if (e.key==='Enter') rl && rl.focus(); });
}

function syncMetaBtn(n, r) {
  const btn = document.getElementById('btn-meta');
  if (!btn) return;
  const ok = n.trim() && r.trim();
  btn.classList.toggle('on', !!ok);
  btn.disabled = !ok;
}

function saveMeta() {
  const n = document.getElementById('inp-name');
  const r = document.getElementById('inp-role');
  if (n) S.name = n.value;
  if (r) S.role = r.value;
  if (S.name.trim() && S.role.trim()) next();
}

/* ── INTERACTIONS ───────────────────────────────────────────── */
function toggleArea(el, area) {
  const i = S.workAreas.indexOf(area);
  if (i > -1) S.workAreas.splice(i, 1); else S.workAreas.push(area);
  el.classList.toggle('on', S.workAreas.includes(area));
  const ar = el.parentElement.querySelectorAll('.c-opt');
  ar.forEach(c => {
    const a = c.textContent.trim();
    c.classList.toggle('on', S.workAreas.includes(a));
    c.setAttribute('aria-checked', S.workAreas.includes(a));
  });
  const btn = document.getElementById('btn-q1');
  if (btn) {
    btn.classList.toggle('on', S.workAreas.length > 0);
    btn.disabled = S.workAreas.length === 0;
  }
}

function setScale(key, val) {
  S[key] = val;
  document.querySelectorAll('.s-opt').forEach(el => {
    const v = parseInt(el.dataset.v);
    el.classList.toggle('on', v === val);
    el.setAttribute('aria-checked', v === val);
  });
  const btn = document.getElementById('btn-sc');
  if (btn) { btn.classList.add('on'); btn.disabled = false; }
}

function taInput(key, el, required) {
  S[key] = el.value;
  const ch = document.getElementById('char-' + key);
  if (ch) ch.textContent = el.value.length + ' / 1200';
  const btn = document.getElementById('btn-ta');
  if (!btn) return;
  const ok = required ? el.value.trim().length > 10 : true;
  btn.classList.toggle('on', ok);
  btn.disabled = !ok;
  btn.textContent = el.value.trim() ? 'Continue →' : 'Skip →';
}

/* ── KEYBOARD ───────────────────────────────────────────────── */
document.addEventListener('keydown', e => {
  const s = S.screen;
  if (s === 'intro' && e.key === 'Enter') { e.preventDefault(); next(); }
  if (['q3','q4'].includes(s)) {
    const n = parseInt(e.key);
    if (n >= 1 && n <= 5) { e.preventDefault(); setScale(s, n); }
    if (e.key === 'Enter' && S[s]) { e.preventDefault(); next(); }
  }
  if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') {
    const textQ = ['q2','q5','q6','q7','q8','q10'];
    if (textQ.includes(s)) { e.preventDefault(); next(); }
  }
  if (e.key === 'Enter' && s === 'meta') { saveMeta(); }
});

/* ── SUBMIT ─────────────────────────────────────────────────── */
async function submitForm() {
  if (S.submitting || S.submitted) return;

  // Duplicate-submit guard
  if (sessionStorage.getItem('cf_done')) { goTo('success'); return; }

  S.submitting = true;
  const btn   = document.getElementById('btn-sub');
  const errEl = document.getElementById('err-msg');
  if (btn) { btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>&nbsp; Submitting…'; }

  const payload = {
    respondent_name:            S.name,
    respondent_role:            S.role,
    work_areas:                 S.workAreas,
    creative_strength:          S.q2,
    brief_execution_rating:     S.q3,
    adaptability_rating:        S.q4,
    standout_project:           S.q5,
    creative_growth:            S.q6,
    recommended_skills:         S.q7,
    professional_recommendation:S.q8,
    portfolio_permission:       S.q9 || 'private',
    personal_message:           S.q10,
    portfolio_status:           'private',
    submitted_at:               new Date().toISOString(),
  };

  try {
    if (db) {
      let { error } = await db.from(CFG.table).insert([payload]);
      // If portfolio_status column hasn't been added yet, retry without it
      if (error && error.message && error.message.includes('portfolio_status')) {
        delete payload.portfolio_status;
        const retry = await db.from(CFG.table).insert([payload]);
        error = retry.error;
      }
      if (error) throw new Error(error.message);
    } else {
      // Dev mode — log to console
      console.log('%cFeedback payload (Supabase not configured)','color:#C8A84C;font-weight:bold');
      console.log(JSON.stringify(payload, null, 2));
      await new Promise(r => setTimeout(r, 900));
    }
    S.submitted = true;
    S.submitting = false;
    sessionStorage.setItem('cf_done', '1');
    goTo('success');
  } catch (err) {
    S.submitting = false;
    if (btn) { btn.disabled = false; btn.textContent = 'Submit feedback →'; }
    if (errEl) {
      errEl.textContent = 'Something went wrong. Please try again. (' + (err.message || 'Unknown error') + ')';
      errEl.classList.add('show');
    }
  }
}

/* ── ADMIN ──────────────────────────────────────────────────── */
async function initAdmin() {
  document.getElementById('app').style.display = 'none';
  const panel = document.getElementById('admin-panel');
  panel.style.display = 'block';

  const pw = prompt('Admin password:');
  if (pw !== CFG.adminPassword) {
    panel.innerHTML = '<p style="padding:60px 0;color:var(--t2);font-size:14px;">Access denied.</p>';
    return;
  }

  panel.innerHTML = `
    <div class="adm-head">
      <h2>Feedback Submissions</h2>
      <span class="adm-meta" id="adm-count">Loading…</span>
    </div>
    <div id="adm-list"><p class="body-md">Fetching…</p></div>`;

  if (!db) {
    document.getElementById('adm-list').innerHTML = '<p class="body-md">Supabase not configured. Add your keys to CFG at the top of this file.</p>';
    document.getElementById('adm-count').textContent = '';
    return;
  }

  try {
    const { data, error } = await db
      .from(CFG.table).select('*')
      .order('submitted_at', { ascending: false });
    if (error) throw error;
    renderAdminRows(data || []);
  } catch (e) {
    document.getElementById('adm-list').innerHTML = `<p style="color:#ff7575;font-size:13px;">Error: ${esc(e.message)}</p>`;
  }
}

function renderAdminRows(rows) {
  document.getElementById('adm-count').textContent = rows.length + ' response' + (rows.length !== 1 ? 's' : '');
  if (!rows.length) {
    document.getElementById('adm-list').innerHTML = '<p class="body-md">No submissions yet.</p>';
    return;
  }
  const html = rows.map((r, i) => {
    const st   = r.portfolio_status || 'private';
    const date = r.submitted_at
      ? new Date(r.submitted_at).toLocaleDateString('en-IN', { day:'numeric', month:'short', year:'numeric' })
      : '—';
    let areaList = [];
    if (Array.isArray(r.work_areas)) {
      areaList = r.work_areas;
    } else if (typeof r.work_areas === 'string') {
      try {
        const parsed = JSON.parse(r.work_areas);
        areaList = Array.isArray(parsed) ? parsed : [r.work_areas];
      } catch (_) {
        areaList = r.work_areas ? [r.work_areas] : [];
      }
    }
    const areas = areaList.length ? areaList.join(', ') : '—';
    const preview = r.professional_recommendation
      ? `<div class="sub-row" style="font-style:italic;color:var(--t1);">"${esc(r.professional_recommendation.slice(0,150))}${r.professional_recommendation.length>150?'…':''}"</div>`
      : '';
    return `
    <div class="sub-card">
      <div class="sub-top">
        <div>
          <div class="sub-name">${esc(r.respondent_name || 'Anonymous')}</div>
          <div class="sub-role">${esc(r.respondent_role || '')}</div>
        </div>
        <div class="sub-right">
          <span class="sub-date">${date}</span>
          <span class="badge ${st}" data-id="${r.id||''}" data-status="${st}"
            onclick="cycleBadge(this)" title="Click to change status">${st}</span>
        </div>
      </div>
      <div class="sub-row"><strong>Work areas:</strong> ${esc(areas)}</div>
      <div class="sub-row">
        <span class="r-pill">${r.brief_execution_rating||'—'}</span>Brief execution&nbsp;·&nbsp;
        <span class="r-pill">${r.adaptability_rating||'—'}</span>Adaptability
      </div>
      ${preview}
      <button class="expand-btn" onclick="toggleExpand(this)">Show full response</button>
      <div class="sub-detail">
        <div class="det-field"><label>Creative Strength</label><p>${esc(r.creative_strength||'—')}</p></div>
        <div class="det-field"><label>Standout Project</label><p>${esc(r.standout_project||'—')}</p></div>
        <div class="det-field"><label>Creative Growth</label><p>${esc(r.creative_growth||'—')}</p></div>
        <div class="det-field"><label>Recommended Skills</label><p>${esc(r.recommended_skills||'—')}</p></div>
        <div class="det-field"><label>Full Recommendation</label><p>${esc(r.professional_recommendation||'—')}</p></div>
        <div class="det-field"><label>Personal Message</label><p>${esc(r.personal_message||'—')}</p></div>
        <div class="det-field"><label>Portfolio Permission</label><p>${esc(r.portfolio_permission||'—')}</p></div>
      </div>
    </div>`;
  }).join('');
  document.getElementById('adm-list').innerHTML = html;
}

function toggleExpand(btn) {
  const det = btn.nextElementSibling;
  det.classList.toggle('open');
  btn.textContent = det.classList.contains('open') ? 'Hide details' : 'Show full response';
}

const STATUS_CYCLE = ['private','approved','published'];
async function cycleBadge(el) {
  const cur  = STATUS_CYCLE.indexOf(el.dataset.status);
  const next = STATUS_CYCLE[(cur + 1) % STATUS_CYCLE.length];
  el.dataset.status = next;
  el.className = 'badge ' + next;
  el.textContent = next;
  if (db && el.dataset.id) {
    await db.from(CFG.table).update({ portfolio_status: next }).eq('id', el.dataset.id);
  }
}

/* ── BOOT ───────────────────────────────────────────────────── */
if (location.search.includes('admin') || location.hash === '#admin') {
  initAdmin();
} else {
  render();
}
</script>

  );

  -- Row Level Security
  ALTER TABLE feedback_responses ENABLE ROW LEVEL SECURITY;

  -- Anyone can submit (INSERT):
  CREATE POLICY "public_insert" ON feedback_responses
    FOR INSERT WITH CHECK (true);

  -- Read and status update:
